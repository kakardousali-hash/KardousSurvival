<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Kardous Survival</title>

<script src="/socket.io/socket.io.js"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,Tahoma,sans-serif;
    background:#10151b;
    color:white;
}

.app{
    min-height:100vh;
    padding:15px;
    background:linear-gradient(135deg,#17251c,#101820);
}

.header{
    background:#0b1015;
    border:1px solid #47535c;
    border-radius:12px;
    padding:12px;
    margin-bottom:12px;
}

h1{
    color:#f1ca68;
    margin:0 0 5px;
}

.status{
    font-size:13px;
    color:#aebbc5;
}

.login{
    max-width:450px;
    margin:40px auto;
    padding:20px;
    background:#1b252e;
    border:2px solid #a67c32;
    border-radius:14px;
    text-align:center;
}

.login h2{
    color:#f1ca68;
}

input{
    width:100%;
    padding:13px;
    margin:8px 0;
    border-radius:8px;
    border:1px solid #53616b;
    background:#0d1318;
    color:white;
    font-size:16px;
}

button{
    width:100%;
    padding:12px;
    margin-top:8px;
    border:1px solid #d0a54d;
    border-radius:8px;
    background:linear-gradient(#8b652a,#4a3518);
    color:white;
    font-weight:bold;
    font-size:15px;
}

button:disabled{
    opacity:.5;
}

.game{
    display:none;
}

.resources{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:7px;
    margin-top:10px;
}

.resource{
    padding:10px;
    background:#1b252e;
    border:1px solid #394853;
    border-radius:7px;
    text-align:center;
}

.resource b{
    color:#f5d36d;
}

.castle{
    margin-top:12px;
    min-height:350px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle,#435a42 0 2px,transparent 3px),
        linear-gradient(135deg,#263927,#17251c);
    background-size:35px 35px,auto;
    border:2px solid #4a5862;
    border-radius:14px;
}

.castle-icon{
    font-size:100px;
}

.info{
    margin-top:12px;
    padding:12px;
    background:#1b252e;
    border:1px solid #47535c;
    border-radius:10px;
}

.message{
    min-height:25px;
    margin-top:10px;
    color:#f1ca68;
}

.logout{
    background:#542d2d;
    border-color:#9b5050;
}

@media(max-width:500px){
    .resources{
        grid-template-columns:repeat(2,1fr);
    }
}
</style>
</head>

<body>

<div class="app">

<header class="header">
    <h1>🏰 Kardous Survival</h1>
    <div class="status" id="status">
        جاري الاتصال بالسيرفر...
    </div>
</header>

<!-- تسجيل الدخول -->

<div class="login" id="loginBox">

    <div style="font-size:70px">🏰</div>

    <h2>ابدأ مملكتك</h2>

    <p>اكتب اسم اللاعب للدخول إلى اللعبة.</p>

    <input
        id="playerName"
        type="text"
        maxlength="20"
        placeholder="اسم اللاعب"
        autocomplete="off"
    >

    <button id="loginButton" onclick="registerPlayer()">
        🚀 دخول اللعبة
    </button>

    <div class="message" id="loginMessage"></div>

</div>

<!-- اللعبة -->

<div class="game" id="gameBox">

    <div class="info">

        <h2>👑 القائد <span id="name"></span></h2>

        <p>
            🏰 مستوى القلعة:
            <b id="castle">1</b>
        </p>

        <p>
            ⚡ القوة:
            <b id="power">0</b>
        </p>

        <p>
            ⚔️ الجنود:
            <b id="troops">0</b>
        </p>

    </div>

    <div class="resources">

        <div class="resource">
            🍎 الطعام
            <br>
            <b id="food">0</b>
        </div>

        <div class="resource">
            🪵 الخشب
            <br>
            <b id="wood">0</b>
        </div>

        <div class="resource">
            ⛓️ الحديد
            <br>
            <b id="iron">0</b>
        </div>

        <div class="resource">
            🪙 الذهب
            <br>
            <b id="gold">0</b>
        </div>

    </div>

    <div class="castle">

        <div class="castle-icon">🏰</div>

        <h2>
            قلعة Kardous
        </h2>

        <p>
            المستوى
            <b id="castleLevel">1</b>
        </p>

    </div>

    <div class="info">

        <h3>🎁 الموارد</h3>

        <button onclick="collectResources()">
            جمع الموارد
        </button>

        <button onclick="trainTroops()">
            ⚔️ تدريب 100 جندي
        </button>

        <button onclick="upgradeCastle()">
            🏗️ تطوير القلعة
        </button>

        <button class="logout" onclick="logout()">
            🚪 خروج
        </button>

        <div class="message" id="gameMessage"></div>

    </div>

</div>

</div>

<script>

/* =========================
   المتغيرات
========================= */

let player = null;
let socket = null;


/* =========================
   عناصر الصفحة
========================= */

const $ = id => document.getElementById(id);


/* =========================
   رسالة
========================= */

function message(text){

    $("gameMessage").textContent = text;

}


/* =========================
   API
========================= */

async function api(url, options = {}){

    const response = await fetch(url, {
        headers:{
            "Content-Type":"application/json"
        },
        ...options
    });

    const text = await response.text();

    let data;

    try{
        data = JSON.parse(text);
    }catch{
        throw new Error(
            "السيرفر أرسل ردًا غير صحيح."
        );
    }

    if(!response.ok){

        throw new Error(
            data.error || "حدث خطأ في السيرفر."
        );

    }

    return data;

}


/* =========================
   تسجيل اللاعب
========================= */

async function registerPlayer(){

    const input = $("playerName");

    const name = input.value.trim();

    if(!name){

        $("loginMessage").textContent =
            "⚠️ اكتب اسم اللاعب أولًا.";

        return;

    }

    const button = $("loginButton");

    button.disabled = true;

    $("loginMessage").textContent =
        "⏳ جاري إنشاء اللاعب...";

    try{

        console.log("Sending register:", name);

        const data = await api(
            "/api/register",
            {
                method:"POST",
                body:JSON.stringify({
                    name:name
                })
            }
        );

        console.log("Register response:", data);

        if(!data.player){

            throw new Error(
                "السيرفر لم يُرجع بيانات اللاعب."
            );

        }

        player = data.player;

        localStorage.setItem(
            "kardousPlayerId",
            player.id
        );

        showGame();

        connectSocket();

    }catch(error){

        console.error(error);

        $("loginMessage").textContent =
            "❌ " + error.message;

    }finally{

        button.disabled = false;

    }

}


/* =========================
   عرض اللعبة
========================= */

function showGame(){

    $("loginBox").style.display = "none";

    $("gameBox").style.display = "block";

    updateUI();

}


/* =========================
   تحديث البيانات
========================= */

function updateUI(){

    if(!player) return;

    $("name").textContent =
        player.name || "";

    $("castle").textContent =
        player.castle || 1;

    $("castleLevel").textContent =
        player.castle || 1;

    $("power").textContent =
        formatNumber(player.power);

    $("troops").textContent =
        formatNumber(player.troops);

    $("food").textContent =
        formatNumber(player.food);

    $("wood").textContent =
        formatNumber(player.wood);

    $("iron").textContent =
        formatNumber(player.iron);

    $("gold").textContent =
        formatNumber(player.gold);

}


/* =========================
   تنسيق الأرقام
========================= */

function formatNumber(value){

    value = Number(value || 0);

    if(value >= 1000000000)
        return (value/1000000000).toFixed(1)+"B";

    if(value >= 1000000)
        return (value/1000000).toFixed(1)+"M";

    if(value >= 1000)
        return (value/1000).toFixed(1)+"K";

    return Math.floor(value).toLocaleString();

}


/* =========================
   جمع الموارد
========================= */

async function collectResources(){

    if(!player) return;

    try{

        const data = await api(
            `/api/player/${player.id}/collect`,
            {
                method:"POST"
            }
        );

        player = data.player;

        updateUI();

        message("🎁 تم جمع الموارد!");

    }catch(error){

        message("❌ " + error.message);

    }

}


/* =========================
   تدريب الجنود
========================= */

async function trainTroops(){

    if(!player) return;

    try{

        const data = await api(
            `/api/player/${player.id}/train`,
            {
                method:"POST"
            }
        );

        player = data.player;

        updateUI();

        message("⚔️ بدأ تدريب 100 جندي!");

    }catch(error){

        message("❌ " + error.message);

    }

}


/* =========================
   تطوير القلعة
========================= */

async function upgradeCastle(){

    if(!player) return;

    try{

        const data = await api(
            `/api/player/${player.id}/upgrade-castle`,
            {
                method:"POST"
            }
        );

        player = data.player;

        updateUI();

        message("🏗️ بدأت ترقية القلعة!");

    }catch(error){

        message("❌ " + error.message);

    }

}


/* =========================
   Socket.IO
========================= */

function connectSocket(){

    if(socket) return;

    try{

        socket = io();

        socket.on("connect", () => {

            $("status").textContent =
                "🟢 متصل بالسيرفر";

        });

        socket.on("disconnect", () => {

            $("status").textContent =
                "🔴 انقطع الاتصال بالسيرفر";

        });

        socket.on("playerUpdated", data => {

            if(
                player &&
                Number(data.id) ===
                Number(player.id)
            ){

                player = data;

                updateUI();

            }

        });

    }catch(error){

        console.error(
            "Socket error:",
            error
        );

    }

}


/* =========================
   تحميل اللاعب المحفوظ
========================= */

async function loadSavedPlayer(){

    const id =
        localStorage.getItem(
            "kardousPlayerId"
        );

    if(!id){

        $("status").textContent =
            "🟡 جاهز لتسجيل لاعب جديد";

        return;

    }

    try{

        const data =
            await api(
                `/api/player/${id}`
            );

        player = data;

        showGame();

        connectSocket();

    }catch(error){

        localStorage.removeItem(
            "kardousPlayerId"
        );

        $("status").textContent =
            "🟡 جاهز لتسجيل لاعب جديد";

    }

}


/* =========================
   خروج
========================= */

function logout(){

    localStorage.removeItem(
        "kardousPlayerId"
    );

    player = null;

    location.reload();

}


/* =========================
   تشغيل اللعبة
========================= */

loadSavedPlayer();

</script>

</body>
</html>
