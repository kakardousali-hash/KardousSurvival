<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kardous Survival</title>

<script src="/socket.io/socket.io.js"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#101820;
 color:white;
 font-family:Arial;
}
header{
 background:#17242e;
 padding:10px;
 position:sticky;
 top:0;
 z-index:10;
}
h1,h2,h3{margin:6px}
.resources{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:5px;
}
.resource{
 background:#263845;
 padding:8px 2px;
 border-radius:8px;
 text-align:center;
 font-size:13px;
}
.page{
 padding:10px;
 padding-bottom:70px;
}
.panel{
 background:#1b2b36;
 padding:12px;
 margin-bottom:10px;
 border-radius:14px;
}
button{
 background:#c78a2c;
 color:white;
 border:0;
 border-radius:9px;
 padding:11px;
 margin:4px;
 font-weight:bold;
}
.hidden{display:none}

#map{
 position:relative;
 height:520px;
 overflow:hidden;
 border:4px solid #687b54;
 border-radius:15px;
 background:
 radial-gradient(circle at 20% 30%,#78935c 0 9%,transparent 10%),
 radial-gradient(circle at 70% 75%,#607c4d 0 12%,transparent 13%),
 linear-gradient(135deg,#456c45,#294d38);
}

.player{
 position:absolute;
 transform:translate(-50%,-50%);
 text-align:center;
 font-size:27px;
 transition:left .6s linear,top .6s linear;
 cursor:pointer;
}
.playerName{
 font-size:11px;
 background:#111b;
 padding:2px 5px;
 border-radius:5px;
 white-space:nowrap;
}

.march{
 position:absolute;
 font-size:27px;
 pointer-events:none;
 transition:left 1s linear,top 1s linear;
}

.controls{
 display:flex;
 flex-wrap:wrap;
 justify-content:center;
}

.log{
 background:#101820;
 padding:8px;
 border-radius:8px;
 min-height:35px;
 font-size:13px;
}
</style>
</head>

<body>

<header>
<h1>🏰 Kardous Survival</h1>

<div class="resources">
<div class="resource">🍎 <span id="food">0</span></div>
<div class="resource">🪵 <span id="wood">0</span></div>
<div class="resource">⛓️ <span id="iron">0</span></div>
<div class="resource">🪙 <span id="gold">0</span></div>
</div>
</header>

<div class="page">

<section id="home">

<div class="panel">
<h2>🏰 قلعة Kardous</h2>
<p>المستوى: <b id="castle">1</b></p>
<p>⚡ القوة: <b id="power">0</b></p>

<div class="controls">
<button onclick="collect()">🌾 جمع</button>
<button onclick="train()">⚔️ تدريب</button>
<button onclick="upgrade()">⬆️ ترقية</button>
</div>
</div>

<div class="panel">
<h3>👑 القائد Kardous</h3>
<p>المستوى: <span id="commander">1</span></p>
<p>الخبرة: <span id="xp">0</span></p>
</div>

<div class="panel">
<h3>⚔️ الجيش</h3>
<p>الجنود: <span id="troops">0</span></p>
</div>

<div class="panel">
<h3>🦸 الأبطال</h3>
<div id="heroes">جاري التحميل...</div>
</div>

</section>

<section id="world" class="hidden">

<div class="panel">
<h2>🌍 المملكة #1</h2>
<p>اللاعبون المتصلون يظهرون على الخريطة.</p>
</div>

<div class="panel">

<div id="map">

<div id="march" class="march">⚔️</div>

</div>

</div>

<div class="panel">
<h3>🚶 مسيرة الجيش</h3>
<button onclick="sendMarch()">إرسال مسيرة</button>
<div class="log" id="log">جاهز.</div>
</div>

</section>

</div>

<div style="
position:fixed;
bottom:0;
left:0;
right:0;
background:#111a21;
display:grid;
grid-template-columns:1fr 1fr;
padding:6px;
z-index:20;
">
<button onclick="show('home')">🏰 القلعة</button>
<button onclick="show('world')">🌍 الخريطة</button>
</div>

<script>

const playerId = 1;

const socket = io();

const map = document.getElementById("map");

let myPlayer = null;
let march = {
 x:50,
 y:50
};

function show(id){

 document.querySelectorAll("section")
 .forEach(x=>x.classList.add("hidden"));

 document.getElementById(id)
 .classList.remove("hidden");
}

async function loadPlayer(){

 const response =
 await fetch(`/api/player/${playerId}`);

 if(!response.ok){
   return;
 }

 const p = await response.json();

 myPlayer = p;

 document.getElementById("food").textContent=p.food;
 document.getElementById("wood").textContent=p.wood;
 document.getElementById("iron").textContent=p.iron;
 document.getElementById("gold").textContent=p.gold;

 document.getElementById("castle").textContent=p.castle;
 document.getElementById("power").textContent=p.power;

 document.getElementById("troops").textContent=p.troops;

 document.getElementById("commander").textContent=
 p.commander.level;

 document.getElementById("xp").textContent=
 p.commander.experience;

 document.getElementById("heroes").innerHTML=
 p.heroes ?
 p.heroes.map(h=>
 `<div class="panel">
 🦸 ${h.name}<br>
 المستوى ${h.level}<br>
 ⚡ القوة ${h.power}
 </div>`
 ).join("")
 :
 "لا يوجد أبطال";

}

async function action(url){

 const response =
 await fetch(url,{method:"POST"});

 const data =
 await response.json();

 alert(data.message || data.error);

 loadPlayer();
}

function collect(){
 action(`/api/player/${playerId}/collect`);
}

function train(){
 action(`/api/player/${playerId}/train`);
}

function upgrade(){
 action(`/api/player/${playerId}/upgrade-castle`);
}

/* =====================
   WORLD
===================== */

function createPlayer(p){

 let element =
 document.getElementById("player-"+p.id);

 if(!element){

   element =
   document.createElement("div");

   element.id="player-"+p.id;
   element.className="player";

   element.innerHTML=
   `🏰<div class="playerName">${p.name}</div>`;

   map.appendChild(element);
 }

 element.style.left=p.x+"%";
 element.style.top=p.y+"%";
}

function renderWorld(players){

 players.forEach(createPlayer);

}

socket.on("world",data=>{

 renderWorld(data.players || []);

});

socket.on("playerMoved",data=>{

 const player =
 document.getElementById("player-"+data.id);

 if(player){

   player.style.left=data.x+"%";
   player.style.top=data.y+"%";

 }

});

/* =====================
   MOVE
===================== */

map.addEventListener("click",async event=>{

 if(!myPlayer)return;

 const rect =
 map.getBoundingClientRect();

 const x =
 ((event.clientX-rect.left)/rect.width)*100;

 const y =
 ((event.clientY-rect.top)/rect.height)*100;

 await fetch(
 `/api/player/${playerId}/move`,
 {
   method:"POST",
   headers:{
     "Content-Type":"application/json"
   },
   body:JSON.stringify({x,y})
 }
 );

});

/* =====================
   MARCH
===================== */

function sendMarch(){

 if(!myPlayer){
   return;
 }

 const startX=myPlayer.x;
 const startY=myPlayer.y;

 const targetX=75;
 const targetY=25;

 const element =
 document.getElementById("march");

 element.style.left=startX+"%";
 element.style.top=startY+"%";

 document.getElementById("log").textContent=
 "⚔️ المسيرة انطلقت...";

 setTimeout(()=>{

   element.style.left=targetX+"%";
   element.style.top=targetY+"%";

 },100);

 setTimeout(()=>{

   document.getElementById("log").textContent=
   "🏰 وصلت المسيرة إلى الهدف.";

 },6100);

}

loadPlayer();

</script>

</body>
</html>
