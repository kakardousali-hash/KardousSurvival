
<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kardous Survival</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #18202a;
    color: white;
    text-align: center;
}

.top {
    background: #111820;
    padding: 12px;
    display: flex;
    justify-content: space-around;
    font-size: 14px;
}

.game {
    min-height: 90vh;
    padding: 20px;
}

h1 {
    margin: 10px;
}

.castle {
    margin: 40px auto 20px;
    width: 220px;
    height: 220px;
    background: #6d7680;
    border: 8px solid #333;
    border-radius: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 90px;
}

.level {
    font-size: 20px;
    margin: 10px;
}

button {
    background: #d99b32;
    border: none;
    padding: 14px 25px;
    border-radius: 10px;
    color: white;
    font-size: 17px;
    margin: 8px;
}

button:active {
    transform: scale(0.95);
}

.panel {
    background: #222d38;
    margin: 15px auto;
    padding: 15px;
    max-width: 400px;
    border-radius: 12px;
}
</style>
</head>

<body>

<div class="top">
    <div>🍎 10,000</div>
    <div>🪵 10,000</div>
    <div>⛓️ 5,000</div>
    <div>🪙 1,000</div>
</div>

<div class="game">

<h1>🏰 Kardous Survival</h1>

<div class="castle">
    🏰
</div>

<div class="level">
    القلعة المستوى 1
</div>

<div class="panel">
    👑 القائد: <b>Kardous</b><br>
    ⭐ الخبرة: 0
</div>

<button onclick="upgrade()">⬆️ ترقية القلعة</button>

<div class="panel">
    ⚔️ الجيش: 0<br>
    🦸 الأبطال: 0<br>
    🐲 Behemioth: 0
</div>

</div>

<script>
let level = 1;

function upgrade() {
    if (level < 30) {
        level++;
        document.querySelector(".level").innerText =
            "القلعة المستوى " + level;
    } else {
        alert("🏰 وصلت القلعة إلى المستوى 30!");
    }
}
</script>

</body>
</html>
